<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="coverColorTitle">
  <title id="coverColorTitle">色卡作品封面</title>
  <defs>
    <linearGradient id="colorBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset=".52" stop-color="#f8f7fc"/>
      <stop offset="1" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="colorBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="colorSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="colorCoral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="colorAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="colorPopupShadow" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#5b4a8a" flood-opacity=".18"/>
    </filter>
    <filter id="colorBarShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4c5885" flood-opacity=".13"/>
    </filter>
    <filter id="colorCursorShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#111827" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#colorBg)"/>
  <circle cx="1120" cy="72" r="220" fill="#c7d2fe" opacity=".26"/>
  <circle cx="72" cy="716" r="200" fill="#fecdd3" opacity=".20"/>
  <circle cx="1090" cy="680" r="120" fill="#fde68a" opacity=".18"/>
  <g fill="#8b9cc4" opacity=".35">
    <circle cx="76" cy="112" r="3"/>
    <circle cx="110" cy="84" r="2"/>
    <circle cx="1080" cy="270" r="3"/>
    <circle cx="1120" cy="240" r="2"/>
  </g>

  <!-- 左侧标题 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="90" y="80" width="114" height="26" rx="13" fill="#eef2ff" stroke="#e0e7ff"/>
    <circle cx="105" cy="93" r="4" fill="#2563eb"/>
    <text x="117" y="97" fill="#4f5fa8" font-size="9.5" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.6">COLOR CARD</text>

    <text x="90" y="167" fill="#171b2e" font-size="44" font-weight="700" letter-spacing="-2">把喜欢的颜色，</text>
    <text x="90" y="214" fill="#171b2e" font-size="44" font-weight="700" letter-spacing="-2">收进<span fill="#2563eb">口袋</span>。</text>
    <text x="92" y="243" fill="#7c87a1" font-size="13">在网页上随手取色，自动保存每一次心动的配色。</text>
  </g>

  <!-- 四根大色条 -->
  <g filter="url(#colorBarShadow)">
    <rect x="90" y="277" width="158" height="366" rx="22" fill="url(#colorBlue)"/>
    <rect x="260" y="277" width="158" height="366" rx="22" fill="url(#colorSky)"/>
    <rect x="430" y="277" width="158" height="366" rx="22" fill="url(#colorCoral)"/>
    <rect x="600" y="277" width="158" height="366" rx="22" fill="url(#colorAmber)"/>
  </g>

  <!-- 色条装饰 -->
  <g opacity=".18" fill="#ffffff">
    <circle cx="193" cy="342" r="58"/>
    <circle cx="201" cy="354" r="30" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="357" cy="585" r="64"/>
    <circle cx="343" cy="572" r="34" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="527" cy="335" r="46"/>
    <circle cx="692" cy="572" r="68"/>
    <path d="M90 536c58-38 108-38 158 0v107H90Z"/>
  </g>
  <g opacity=".10" fill="none" stroke="#ffffff" stroke-width="1.2">
    <path d="M90 490h158M90 520h158M90 550h158M90 580h158M90 610h158"/>
    <path d="M170 277v366M340 277v366M510 277v366M680 277v366"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#ffffff">
    <text x="112" y="311" font-size="10" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.2" opacity=".7">01</text>
    <text x="112" y="603" fill="#ffffff" font-size="11" opacity=".75">Pishen Blue</text>
    <text x="112" y="626" font-size="16" font-weight="700" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing=".4">#2563EB</text>

    <text x="282" y="311" font-size="10" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.2" opacity=".75">02</text>
    <text x="282" y="603" font-size="11" opacity=".8">Sky</text>
    <text x="282" y="626" font-size="16" font-weight="700" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing=".4">#38BDF8</text>

    <text x="452" y="311" font-size="10" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.2" opacity=".75">03</text>
    <text x="452" y="603" font-size="11" opacity=".8">Coral</text>
    <text x="452" y="626" font-size="16" font-weight="700" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing=".4">#FB7185</text>

    <text x="622" y="311" fill="#6d4206" font-size="10" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.2" opacity=".68">04</text>
    <text x="622" y="603" fill="#6d4206" font-size="11" opacity=".75">Sun</text>
    <text x="622" y="626" fill="#6d4206" font-size="16" font-weight="700" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing=".4">#FBBF24</text>
  </g>

  <!-- 取色器光标与色值气泡 -->
  <g filter="url(#colorCursorShadow)">
    <path d="M378 365l-26 66 21-13 12 24 9-5-12-23 22-4Z" fill="#171b2e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g filter="url(#colorCursorShadow)">
    <rect x="398" y="348" width="94" height="31" rx="15.5" fill="#ffffff"/>
    <circle cx="416" cy="363.5" r="6" fill="#38bdf8"/>
    <text x="429" y="368" fill="#30364d" font-size="10" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing=".4">#38BDF8</text>
  </g>

  <!-- 右侧扩展弹窗 -->
  <g filter="url(#colorPopupShadow)">
    <rect x="820" y="100" width="310" height="520" rx="27" fill="#ffffff" stroke="#eef0f8"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="842" y="121" width="27" height="27" rx="8" fill="#eef2ff"/>
    <circle cx="855.5" cy="134.5" r="6" fill="#2563eb"/>
    <circle cx="855.5" cy="134.5" r="2.5" fill="#ffffff"/>
    <text x="880" y="132" fill="#252a40" font-size="11" font-weight="600">色卡</text>
    <text x="880" y="145" fill="#9aa4ba" font-size="7" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1">COLOR PICKER</text>
    <circle cx="1093" cy="134" r="9" fill="#f3f5fa"/>
    <path d="m1090 131 6 6m0-6-6 6" stroke="#8c98b0" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 当前颜色 -->
    <rect x="842" y="164" width="266" height="153" rx="17" fill="#38bdf8"/>
    <circle cx="1072" cy="192" r="54" fill="#ffffff" opacity=".12"/>
    <circle cx="1053" cy="185" r="24" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.4"/>
    <text x="862" y="193" fill="#ffffff" font-size="8.5" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.2" opacity=".8">CURRENT COLOR</text>
    <text x="862" y="259" fill="#ffffff" font-size="35" font-weight="700" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="-1">#38BDF8</text>
    <text x="862" y="285" fill="#ffffff" font-size="11" opacity=".82">Sky Blue / 晴空蓝</text>
    <circle cx="1082" cy="279" r="14" fill="#ffffff" opacity=".18"/>
    <path d="M1076 279h12M1082 273v12" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 色相滑条 -->
    <text x="842" y="343" fill="#8b96ad" font-size="8.5" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.1">HUE</text>
    <text x="1108" y="343" fill="#5c6880" font-size="8.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">203°</text>
    <rect x="842" y="353" width="266" height="9" rx="4.5" fill="#dbe4f5"/>
    <rect x="842" y="353" width="176" height="9" rx="4.5" fill="#38bdf8"/>
    <circle cx="1018" cy="357.5" r="8" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>

    <!-- 最近使用 -->
    <text x="842" y="397" fill="#8b96ad" font-size="8.5" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.1">RECENT</text>
    <text x="1108" y="397" fill="#b3bccd" font-size="8" text-anchor="end">24 种</text>
    <g>
      <rect x="842" y="408" width="37" height="37" rx="10" fill="#2563eb"/>
      <rect x="887" y="408" width="37" height="37" rx="10" fill="#38bdf8"/>
      <rect x="932" y="408" width="37" height="37" rx="10" fill="#fb7185"/>
      <rect x="977" y="408" width="37" height="37" rx="10" fill="#fbbf24"/>
      <rect x="1022" y="408" width="37" height="37" rx="10" fill="#10b981"/>
      <rect x="1067" y="408" width="37" height="37" rx="10" fill="#8b5cf6"/>
      <rect x="842" y="408" width="37" height="37" rx="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- 按钮 -->
    <rect x="842" y="468" width="266" height="45" rx="12" fill="#2563eb"/>
    <path d="M885 484h10v9h-10zM888 481h10v9" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
    <text x="975" y="495" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle">复制色值</text>
    <text x="975" y="536" fill="#a7b1c5" font-size="8.5" text-anchor="middle">点一下，把颜色带进下个作品里。</text>

    <path d="M842 556h266" stroke="#f0f3f9"/>
    <circle cx="850" cy="577" r="3" fill="#22c55e"/>
    <text x="860" y="580" fill="#8b96ad" font-size="8.5">已在 3 个网页上取色 · 本地保存</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <circle cx="94" cy="690" r="3" fill="#2563eb"/>
    <text x="105" y="694" fill="#8893aa" font-size="10.5">点击网页任意位置取色 · 自动复制 HEX · 不收集你的浏览记录</text>
  </g>

  <text x="1130" y="716" text-anchor="end" fill="#9aa4ba" opacity=".8" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="2.4">PISHEN.TECH</text>
</svg>
