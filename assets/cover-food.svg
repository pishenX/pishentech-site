<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="coverFoodTitle">
  <title id="coverFoodTitle">今天吃什么作品封面</title>
  <defs>
    <linearGradient id="foodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset=".55" stop-color="#fff3e4"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
    <linearGradient id="foodCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#fffaf3"/>
    </linearGradient>
    <filter id="foodShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#a85a2a" flood-opacity=".15"/>
    </filter>
    <filter id="foodWheelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8f4b22" flood-opacity=".20"/>
    </filter>
    <filter id="foodRowShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#b8774b" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#foodBg)"/>

  <!-- 背景装饰 -->
  <circle cx="1140" cy="60" r="210" fill="#fbbf24" opacity=".12"/>
  <circle cx="48" cy="704" r="190" fill="#fb7185" opacity=".09"/>
  <circle cx="1100" cy="685" r="120" fill="#f59e0b" opacity=".08"/>
  <g fill="#d69a65" opacity=".26">
    <circle cx="72" cy="112" r="4"/>
    <circle cx="105" cy="88" r="2.5"/>
    <circle cx="1130" cy="272" r="4"/>
    <circle cx="1098" cy="310" r="2.5"/>
    <circle cx="72" cy="632" r="2.5"/>
    <circle cx="1068" cy="636" r="3"/>
  </g>
  <path d="M104 538c-16 20-26 46-26 72M102 538c-18 22-22 50-20 78" fill="none" stroke="#e7b98f" stroke-width="2" stroke-linecap="round" opacity=".45"/>
  <path d="M1128 342c18 20 27 48 27 75M1130 342c18 23 22 51 20 78" fill="none" stroke="#e7b98f" stroke-width="2" stroke-linecap="round" opacity=".45"/>

  <!-- 主卡片 -->
  <g filter="url(#foodShadow)">
    <rect x="90" y="84" width="1020" height="582" rx="38" fill="url(#foodCard)" stroke="#fff" stroke-width="2"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- 顶部 -->
    <rect x="150" y="126" width="118" height="26" rx="13" fill="#fff1e3"/>
    <circle cx="164" cy="139" r="4" fill="#f97316"/>
    <text x="176" y="143" fill="#b35a19" font-size="9.5" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.6">LUNCH DECIDER</text>
    <text x="1015" y="145" fill="#c8a789" font-size="11" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.4">12:30 · 今天</text>

    <!-- 左侧文案 -->
    <text x="150" y="256" fill="#382216" font-size="49" font-weight="700" letter-spacing="-2">今天吃什么？</text>
    <text x="152" y="294" fill="#9b7b63" font-size="14">把选择交给一点点运气，别让午饭消耗太多脑细胞。</text>

    <!-- 筛选标签 -->
    <g font-size="11.5">
      <rect x="152" y="324" width="82" height="29" rx="14.5" fill="#382216"/>
      <text x="193" y="343" fill="#fff" text-anchor="middle">不限预算</text>
      <rect x="243" y="324" width="72" height="29" rx="14.5" fill="#fff7ee" stroke="#f0ddca"/>
      <text x="279" y="343" fill="#a57d5e" text-anchor="middle">30 元内</text>
      <rect x="324" y="324" width="62" height="29" rx="14.5" fill="#fff7ee" stroke="#f0ddca"/>
      <text x="355" y="343" fill="#a57d5e" text-anchor="middle">不辣</text>
    </g>

    <!-- 三个备选 -->
    <g filter="url(#foodRowShadow)">
      <rect x="150" y="382" width="520" height="66" rx="17" fill="#ffffff" stroke="#f4e9dc"/>
      <rect x="150" y="462" width="520" height="66" rx="17" fill="#ffffff" stroke="#f4e9dc"/>
      <rect x="150" y="542" width="520" height="66" rx="17" fill="#ffffff" stroke="#f4e9dc"/>
    </g>

    <!-- 番茄牛腩饭 -->
    <circle cx="185" cy="415" r="22" fill="#fff0e5"/>
    <path d="M167 413h36c0 13-8 21-18 21s-18-8-18-21Z" fill="#f97316"/>
    <path d="M170 411c4-8 11-10 15-5 4-5 11-3 15 5Z" fill="#fb7185"/>
    <circle cx="176" cy="407" r="2.2" fill="#fcd34d"/>
    <circle cx="194" cy="405" r="2.2" fill="#fcd34d"/>
    <text x="221" y="410" fill="#3f2a1d" font-size="14" font-weight="600">番茄牛腩饭</text>
    <text x="221" y="429" fill="#ad927d" font-size="10.5">酸甜开胃 · 楼下那家 · 步行 4 分钟</text>
    <text x="643" y="420" fill="#f97316" font-size="15" font-weight="700" text-anchor="end">¥26</text>
    <path d="m653 409 5 5-5 5" fill="none" stroke="#d5bea9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 豚骨拉面 -->
    <circle cx="185" cy="495" r="22" fill="#fff7df"/>
    <path d="M168 492h34c0 14-7 23-17 23s-17-9-17-23Z" fill="#fbbf24"/>
    <path d="M174 490c4-7 8-7 11-1 4-6 8-5 11 1" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M198 480c7 2 9 7 7 12" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <text x="221" y="490" fill="#3f2a1d" font-size="14" font-weight="600">日式豚骨拉面</text>
    <text x="221" y="509" fill="#ad927d" font-size="10.5">浓郁汤底 · 商场 B1 · 步行 9 分钟</text>
    <text x="643" y="500" fill="#f97316" font-size="15" font-weight="700" text-anchor="end">¥32</text>
    <path d="m653 489 5 5-5 5" fill="none" stroke="#d5bea9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 牛油果沙拉 -->
    <circle cx="185" cy="575" r="22" fill="#eef8ea"/>
    <path d="M170 568c0 14 6 24 15 24s15-10 15-24Z" fill="#86c76d"/>
    <path d="M178 563c4-6 10-6 14 0" fill="none" stroke="#4d9c3f" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="185" cy="580" r="5" fill="#6b4b2a"/>
    <text x="221" y="570" fill="#3f2a1d" font-size="14" font-weight="600">牛油果鸡胸沙拉</text>
    <text x="221" y="589" fill="#ad927d" font-size="10.5">轻盈一点 · 公司楼下 · 步行 2 分钟</text>
    <text x="643" y="580" fill="#f97316" font-size="15" font-weight="700" text-anchor="end">¥24</text>
    <path d="m653 569 5 5-5 5" fill="none" stroke="#d5bea9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="152" y="637" fill="#b79b84" font-size="10.5">从 50 道菜里随机抽 8 个，剩下的交给指针。</text>

    <!-- 右侧转盘 -->
    <g filter="url(#foodWheelShadow)">
      <circle cx="850" cy="370" r="176" fill="#fff" opacity=".55"/>
      <circle cx="850" cy="370" r="166" fill="none" stroke="#eccfb4" stroke-width="1.5" stroke-dasharray="4 9"/>
      <path d="M850 370 850 222a148 148 0 0 1 128.2 74Z" fill="#fb7185"/>
      <path d="M850 370l128.2-74a148 148 0 0 1 0 148Z" fill="#fbbf24"/>
      <path d="M850 370l128.2 74A148 148 0 0 1 850 518Z" fill="#34d399"/>
      <path d="M850 370v148a148 148 0 0 1-128.2-74Z" fill="#60a5fa"/>
      <path d="M850 370l-128.2 74a148 148 0 0 1 0-148Z" fill="#a78bfa"/>
      <path d="M850 370l-128.2-74A148 148 0 0 1 850 222Z" fill="#fcd34d"/>
      <circle cx="850" cy="370" r="148" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
      <circle cx="850" cy="370" r="62" fill="#ffffff" stroke="#f5e3d0" stroke-width="1.5"/>
      <text x="850" y="365" fill="#3f2a1d" font-size="17" font-weight="700" text-anchor="middle">转一转</text>
      <text x="850" y="385" fill="#b3947b" font-size="9.5" text-anchor="middle" letter-spacing="1.4">LET FATE DECIDE</text>
      <path d="M825 208 875 208 850 251Z" fill="#382216"/>
      <circle cx="850" cy="208" r="9" fill="#fff" stroke="#382216" stroke-width="3"/>
    </g>

    <text x="850" y="580" fill="#5e4230" font-size="12" font-weight="600" text-anchor="middle">50 道菜已就位</text>
    <text x="850" y="601" fill="#ad927d" font-size="10.5" text-anchor="middle">点一下中间的按钮，今天就交给运气。</text>
  </g>

  <text x="1130" y="716" text-anchor="end" fill="#b08d72" opacity=".7" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="2.4">PISHEN.TECH</text>
</svg>
