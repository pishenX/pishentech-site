    <path d="M772 314h256" stroke="#eadfce"/>

    <g fill="#75604b" font-size="9.8">
      <text x="772" y="342">嘿，一年后的你：</text>
      <text x="772" y="363">最近过得怎么样？有没有把那个一直想做的</text>
      <text x="772" y="381">项目，认认真真地做完？</text>
      <text x="772" y="408">我现在正在一个普通的周六下午，桌上有一</text>
      <text x="772" y="426">杯凉掉的美式，窗外的树叶开始变黄。</text>
    </g>

    <rect x="772" y="449" width="256" height="54" rx="7" fill="#f7f0e4"/>
    <path d="M772 449v54" stroke="#2563eb" stroke-width="2.5"/>
    <text x="786" y="470" fill="#5b4835" font-size="8.8" font-style="italic">“慢一点也没关系，</text>
    <text x="786" y="487" fill="#5b4835" font-size="8.8" font-style="italic">只要还在往前走。”</text>

    <g fill="#75604b" font-size="9.8">
      <text x="772" y="530">希望你仍然对世界好奇，仍然愿意为一个</text>
      <text x="772" y="548">很小的细节反复修改。</text>
    </g>
    <text x="772" y="595" fill="#b7a58f" font-size="8" font-family="'SFMono-Regular',Consolas,monospace">642 WORDS · 4 MIN READ</text>
