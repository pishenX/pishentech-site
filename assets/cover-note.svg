  <!-- 编辑区顶部 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="365" y="178" fill="#b3a08b" font-size="9" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.3">随笔 / 写给未来的自己</text>
