    <g fill="none" stroke="#a08a73" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M368 214h11M368 219h7"/>
      <path d="M399 211v13M394 216h10"/>
      <path d="M425 217h11M430.5 211.5v11"/>
      <path d="M456 212h11v10h-11z"/>
      <path d="m485 220 5-10 5 10M487 216h6"/>
      <path d="M521 212v10M516 217h10"/>
    </g>
    <path d="M550 207v21" stroke="#eadfce"/>

    <!-- 编辑正文 -->
    <text x="365" y="263" fill="#2d241b" font-size="23" font-weight="700" letter-spacing="-.8">写给未来的自己</text>
    <text x="365" y="291" fill="#b7a58f" font-size="9" font-family="'SFMono-Regular',Consolas,monospace">2026.10.24 · 杭州 · 晴</text>

    <g fill="#6f5b47" font-size="11.8" line-height="1.9">
      <text x="365" y="330">嘿，一年后的你：</text>
      <text x="365" y="357">最近过得怎么样？有没有把那个一直</text>
      <text x="365" y="378">想做的项目，认认真真地做完？</text>
      <text x="365" y="410">我现在正在一个普通的周六下午，</text>
      <text x="365" y="431">桌上有一杯凉掉的美式，窗外的树</text>
      <text x="365" y="452">叶开始变黄。生活没有什么大事，</text>
      <text x="365" y="473">但也不算太坏。</text>
    </g>

    <rect x="365" y="500" width="310" height="64" rx="8" fill="#f7f0e4"/>
    <path d="M365 500v64" stroke="#2563eb" stroke-width="3"/>
    <text x="382" y="524" fill="#5b4835" font-size="10.5" font-style="italic">“慢一点也没关系，只要还在往前走。”</text>
    <text x="382" y="546" fill="#ae9a83" font-size="8.5">—— 这是现在的我最想告诉你的话</text>

    <g fill="#75604b" font-size="11.2">
      <text x="365" y="595">希望你仍然对世界好奇，仍然愿意为</text>
      <text x="365" y="616">一个很小的细节反复修改。也希望你</text>
      <text x="365" y="637">偶尔抬头，看看窗外的天气。</text>
    </g>
    <text x="365" y="663" fill="#b7a58f" font-size="8.5" font-family="'SFMono-Regular',Consolas,monospace">642 字 · 预计阅读 4 分钟</text>

    <!-- 右侧预览 -->
    <path d="M724 207v421" stroke="#eee4d6"/>
    <text x="753" y="218" fill="#b3a08b" font-size="8" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.5">PREVIEW</text>
    <rect x="748" y="233" width="304" height="394" rx="11" fill="#fffaf2" stroke="#eadfce"/>
