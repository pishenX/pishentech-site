    <text x="129" y="370" fill="#c0ad97" font-size="8"># 随笔　# 慢慢来</text>

    <text x="129" y="411" fill="#6c5743" font-size="11">关于「慢」</text>
    <text x="129" y="428" fill="#b29d87" font-size="8.5">10 月 18 日</text>
    <path d="M123 441h188" stroke="#eee4d5"/>

    <text x="129" y="464" fill="#6c5743" font-size="11">十月清单</text>
    <text x="129" y="481" fill="#b29d87" font-size="8.5">10 月 09 日</text>
    <path d="M123 494h188" stroke="#eee4d5"/>

    <text x="129" y="517" fill="#6c5743" font-size="11">一个产品的诞生</text>
    <text x="129" y="534" fill="#b29d87" font-size="8.5">09 月 27 日</text>
    <path d="M123 547h188" stroke="#eee4d5"/>

    <text x="129" y="570" fill="#6c5743" font-size="11">秋日读书笔记</text>
    <text x="129" y="587" fill="#b29d87" font-size="8.5">09 月 12 日</text>

    <path d="M123 612h188" stroke="#e7dccb"/>
