<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="coverApiTitle">
  <title id="coverApiTitle">API 小抄作品封面</title>
  <defs>
    <linearGradient id="apiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset=".55" stop-color="#081627"/>
      <stop offset="1" stop-color="#0a1d35"/>
    </linearGradient>
    <linearGradient id="apiWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a30"/>
      <stop offset="1" stop-color="#081425"/>
    </linearGradient>
    <linearGradient id="apiLogo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="apiGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apiTealGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="apiShadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="apiSelected" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity=".20"/>
    </filter>
    <pattern id="apiGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#7dd3fc" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#apiBg)"/>
  <rect width="1200" height="750" fill="url(#apiGrid)"/>
  <circle cx="1010" cy="90" r="330" fill="url(#apiGlow)"/>
  <circle cx="150" cy="720" r="300" fill="url(#apiTealGlow)"/>

  <!-- 背景代码装饰 -->
  <g fill="#4f6f95" opacity=".14" font-family="'SFMono-Regular',Consolas,monospace" font-size="11">
    <text x="58" y="724">{ "status": 200, "data": [] }</text>
    <text x="945" y="716">GET /api/v1/health</text>
    <text x="72" y="70" opacity=".7">// build small things</text>
  </g>
  <g fill="#7dd3fc" opacity=".28">
    <circle cx="64" cy="150" r="3"/>
    <circle cx="96" cy="120" r="2"/>
    <circle cx="1142" cy="650" r="3"/>
    <circle cx="1108" cy="682" r="2"/>
  </g>

  <!-- 主窗口 -->
  <g filter="url(#apiShadow)">
    <rect x="85" y="82" width="1030" height="590" rx="26" fill="url(#apiWindow)" stroke="#203752" stroke-width="1.5"/>
  </g>

  <!-- 顶栏 -->
  <path d="M85 108c0-14 11-26 26-26h978c15 0 26 12 26 26v41H85Z" fill="#0d1d35"/>
  <circle cx="116" cy="111" r="4.5" fill="#fb7185"/>
  <circle cx="133" cy="111" r="4.5" fill="#fbbf24"/>
  <circle cx="150" cy="111" r="4.5" fill="#34d399"/>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="178" y="97" width="29" height="29" rx="8" fill="url(#apiLogo)"/>
    <path d="m188 106-4 5.5 4 5.5M197 106l4 5.5-4 5.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="219" y="116" fill="#e2e8f0" font-size="12.5" font-weight="600">API 小抄</text>
    <rect x="294" y="101" width="53" height="20" rx="6" fill="#102c4a" stroke="#1e4a70"/>
    <text x="320.5" y="115" fill="#5eead4" font-size="7" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">OFFLINE</text>

    <text x="402" y="116" fill="#8aa2c0" font-size="9.5">全部</text>
    <text x="454" y="116" fill="#8aa2c0" font-size="9.5">用户</text>
    <text x="506" y="116" fill="#8aa2c0" font-size="9.5">支付</text>
    <text x="558" y="116" fill="#8aa2c0" font-size="9.5">文件</text>
    <rect x="390" y="127" width="24" height="2" rx="1" fill="#3b82f6"/>

    <rect x="914" y="99" width="88" height="26" rx="8" fill="#0a1830" stroke="#253c59"/>
    <text x="958" y="116" fill="#7e99bc" font-size="8.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">⌘ K</text>
    <circle cx="1038" cy="112" r="10" fill="#142842"/>
    <path d="M1032 112h12M1038 106v12" stroke="#8aa2c0" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
    <circle cx="1071" cy="112" r="10" fill="#142842"/>
    <path d="M1067 108h8v8h-8z" fill="none" stroke="#8aa2c0" stroke-width="1.1"/>
  </g>

  <!-- 侧边栏 -->
  <rect x="85" y="149" width="215" height="523" fill="#081426"/>
  <path d="M300 149v523" stroke="#1b2f49"/>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="109" y="184" fill="#536f91" font-size="8" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.9">目录 / CONTENTS</text>

    <rect x="101" y="201" width="183" height="39" rx="8" fill="#15335c" stroke="#2c5f9d"/>
    <rect x="101" y="201" width="3" height="39" rx="1.5" fill="#60a5fa"/>
    <path d="M120 212h9M120 218h9M120 224h6" stroke="#93c5fd" stroke-width="1.3" stroke-linecap="round"/>
    <text x="139" y="225" fill="#dbeafe" font-size="10.5" font-weight="600">全部接口</text>
    <text x="268" y="225" fill="#93c5fd" font-size="8" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">128</text>

    <path d="M120 253h9M120 259h9M120 265h6" stroke="#6986a9" stroke-width="1.3" stroke-linecap="round"/>
    <text x="139" y="266" fill="#7e97b5" font-size="10.5">用户与权限</text>
    <text x="268" y="266" fill="#4d688a" font-size="8" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">32</text>

    <path d="M120 294h9M120 300h9M120 306h6" stroke="#6986a9" stroke-width="1.3" stroke-linecap="round"/>
    <text x="139" y="307" fill="#7e97b5" font-size="10.5">内容管理</text>
    <text x="268" y="307" fill="#4d688a" font-size="8" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">24</text>

    <path d="M120 335h9M120 341h9M120 347h6" stroke="#6986a9" stroke-width="1.3" stroke-linecap="round"/>
    <text x="139" y="348" fill="#7e97b5" font-size="10.5">支付与订单</text>
    <text x="268" y="348" fill="#4d688a" font-size="8" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">18</text>

    <path d="M120 376h9M120 382h9M120 388h6" stroke="#6986a9" stroke-width="1.3" stroke-linecap="round"/>
    <text x="139" y="389" fill="#7e97b5" font-size="10.5">文件与上传</text>
    <text x="268" y="389" fill="#4d688a" font-size="8" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">14</text>

    <path d="M120 417h9M120 423h9M120 429h6" stroke="#6986a9" stroke-width="1.3" stroke-linecap="round"/>
    <text x="139" y="430" fill="#7e97b5" font-size="10.5">错误码</text>
    <text x="268" y="430" fill="#4d688a" font-size="8" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace">40</text>

    <path d="M109 462h167" stroke="#172c46"/>
    <text x="109" y="489" fill="#536f91" font-size="8" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="1.9">最近查看</text>
    <circle cx="116" cy="512" r="3" fill="#60a5fa"/>
    <text x="128" y="516" fill="#7089a8" font-size="9.5">GET /users</text>
    <circle cx="116" cy="537" r="3" fill="#fbbf24"/>
    <text x="128" y="541" fill="#7089a8" font-size="9.5">POST /auth/login</text>
    <circle cx="116" cy="562" r="3" fill="#fb7185"/>
    <text x="128" y="566" fill="#7089a8" font-size="9.5">DELETE /posts/:id</text>

    <rect x="101" y="600" width="183" height="52" rx="9" fill="#0b1c31" stroke="#1b3552"/>
    <circle cx="119" cy="618" r="4" fill="#34d399"/>
    <text x="130" y="622" fill="#8aa2c0" font-size="8.5">离线可用</text>
    <text x="119" y="640" fill="#536f91" font-size="7.5">已缓存 128 个接口</text>
  </g>

  <!-- 主内容 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="329" y="185" fill="#e2e8f0" font-size="16" font-weight="600">查一个接口，马上就能用。</text>
    <text x="329" y="205" fill="#5f7a9e" font-size="9.5">把常用的请求、参数和错误码放在手边，少开几个搜索标签页。</text>

    <!-- 搜索框 -->
    <rect x="329" y="223" width="761" height="51" rx="12" fill="#0a1930" stroke="#2b4a70"/>
    <circle cx="352" cy="247" r="6.5" fill="none" stroke="#6f8db0" stroke-width="1.5"/>
    <path d="m357 252 6 6" stroke="#6f8db0" stroke-width="1.5" stroke-linecap="round"/>
    <text x="375" y="252" fill="#6884a5" font-size="10.5">搜索接口、参数或错误码...</text>
    <rect x="1019" y="234" width="54" height="28" rx="7" fill="#122946"/>
    <text x="1046" y="252" fill="#7e99bc" font-size="8" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">⌘ K</text>

    <!-- 过滤 -->
    <g font-family="'SFMono-Regular',Consolas,monospace" font-size="8">
      <rect x="329" y="290" width="42" height="24" rx="6" fill="#0e3b30" stroke="#1c6a54"/>
      <text x="350" y="306" fill="#6ee7b7" text-anchor="middle">GET</text>
      <rect x="377" y="290" width="48" height="24" rx="6" fill="#102f4f" stroke="#225582"/>
      <text x="401" y="306" fill="#93c5fd" text-anchor="middle">POST</text>
      <rect x="431" y="290" width="58" height="24" rx="6" fill="#3a1d30" stroke="#6e3354"/>
      <text x="460" y="306" fill="#fda4af" text-anchor="middle">DELETE</text>
      <text x="1080" y="306" fill="#5f7a9e" font-size="8" text-anchor="end">128 RESULTS</text>
    </g>

    <!-- 结果一：选中 -->
    <g filter="url(#apiSelected)">
      <rect x="329" y="331" width="761" height="78" rx="12" fill="#102a4e" stroke="#2f6fbd" stroke-width="1.2"/>
    </g>
    <rect x="329" y="331" width="3" height="78" rx="1.5" fill="#60a5fa"/>
    <rect x="347" y="346" width="44" height="23" rx="6" fill="#0e3b30"/>
    <text x="369" y="362" fill="#6ee7b7" font-size="8.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">GET</text>
    <text x="404" y="363" fill="#e2e8f0" font-size="12.5" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace">/api/v1/users</text>
    <text x="347" y="389" fill="#8aa2c0" font-size="9.5">获取用户列表，支持分页、搜索和排序</text>
    <rect x="929" y="346" width="44" height="20" rx="5" fill="#0e3b30"/>
    <text x="951" y="360" fill="#6ee7b7" font-size="7" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">200</text>
    <path d="m1052 360 5 5-5 5" fill="none" stroke="#8aa2c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="'SFMono-Regular',Consolas,monospace" font-size="7" fill="#5f7a9e">
      <text x="347" y="402">AUTH</text>
      <text x="383" y="402">PAGINATION</text>
      <text x="462" y="402">SORT</text>
    </g>

    <!-- 结果二 -->
    <rect x="329" y="421" width="761" height="78" rx="12" fill="#0b1b31" stroke="#1b3452"/>
    <rect x="347" y="436" width="50" height="23" rx="6" fill="#102f4f"/>
    <text x="372" y="452" fill="#93c5fd" font-size="8.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">POST</text>
    <text x="410" y="453" fill="#d7e3f2" font-size="12.5" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace">/api/v1/users</text>
    <text x="347" y="479" fill="#7791b3" font-size="9.5">创建一个新用户，返回创建后的完整资料</text>
    <rect x="929" y="436" width="44" height="20" rx="5" fill="#102f4f"/>
    <text x="951" y="450" fill="#93c5fd" font-size="7" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">201</text>
    <path d="m1052 450 5 5-5 5" fill="none" stroke="#5f7a9e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 结果三 -->
    <rect x="329" y="511" width="761" height="78" rx="12" fill="#0b1b31" stroke="#1b3452"/>
    <rect x="347" y="526" width="42" height="23" rx="6" fill="#0e3b30"/>
    <text x="368" y="542" fill="#6ee7b7" font-size="8.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">GET</text>
    <text x="402" y="543" fill="#d7e3f2" font-size="12.5" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace">/api/v1/users/:id</text>
    <text x="347" y="569" fill="#7791b3" font-size="9.5">按 ID 获取用户详情，包含角色和权限信息</text>
    <rect x="929" y="526" width="44" height="20" rx="5" fill="#0e3b30"/>
    <text x="951" y="540" fill="#6ee7b7" font-size="7" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">200</text>
    <path d="m1052 540 5 5-5 5" fill="none" stroke="#5f7a9e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 结果四 -->
    <rect x="329" y="601" width="761" height="50" rx="12" fill="#0b1b31" stroke="#1b3452"/>
    <rect x="347" y="614" width="58" height="23" rx="6" fill="#3a1d30"/>
    <text x="376" y="630" fill="#fda4af" font-size="8.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">DELETE</text>
    <text x="418" y="631" fill="#d7e3f2" font-size="12.5" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace">/api/v1/users/:id</text>
    <text x="347" y="651" fill="#7791b3" font-size="9.5">删除用户（需要管理员权限）</text>
    <rect x="929" y="614" width="44" height="20" rx="5" fill="#3a1d30"/>
    <text x="951" y="628" fill="#fda4af" font-size="7" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">204</text>
  </g>

  <g opacity=".65">
    <text x="1130" y="716" text-anchor="end" fill="#7190b6" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="2.4">PISHEN.TECH</text>
  </g>
</svg>
