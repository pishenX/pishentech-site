<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="皮神科技个人站，展示一些小软件和代码。">
  <meta name="author" content="皮神">
  <meta name="theme-color" content="#f6f8fc">
  <link rel="canonical" href="https://pishentech.cn/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="皮神科技">
  <meta property="og:title" content="皮神科技">
  <meta property="og:description" content="皮神科技个人站，展示一些小软件和代码。">
  <meta property="og:url" content="https://pishentech.cn/">
  <title>皮神科技</title>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">

  <script src="js/data.js" defer></script>
  <script src="js/site.js" defer></script>
</head>

<body data-page="works">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <!-- ==================== 顶部导航 ==================== -->
  <header class="site-header" data-header>
    <div class="container header-inner">
      <a class="brand" href="#works" aria-label="皮神科技作品页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M12.5 9 6 16l6.5 7M19.5 9l6.5 7-6.5 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">皮神科技<span class="brand-dot">.</span></span>
      </a>

      <div class="header-actions">
        <a class="btn btn-ghost btn-sm header-contact" href="mailto:hello@pishentech.cn" data-email-link>
          联系我
          <svg class="icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 15 15 5M7 5h8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ==================== 作品 ==================== -->
    <section class="works works-page" id="works">
      <div class="container">
        <div class="section-head works-head">
          <div class="section-title-wrap">
            <h1 class="works-title">一些做完了的小东西<span class="title-dot">.</span></h1>
          </div>

          <div class="works-head-side">
            <p class="section-desc">
              从随手写的小工具，到认真上线的作品。每一个都解决了一个具体的小问题。
            </p>
            <div class="works-count">
              <span><strong data-stat="projects">06</strong> 个作品</span>
              <i aria-hidden="true"></i>
              <span><strong data-stat="opensource">04</strong> 个已开源</span>
            </div>
          </div>
        </div>

        <!-- 分类按钮由 JS 根据 data.js 自动生成 -->
        <div class="filters" role="group" aria-label="按类别筛选作品" data-filters></div>

        <!-- 作品卡片由 JS 根据 data.js 自动生成 -->
        <div class="project-grid" data-projects></div>

        <div class="empty-state" data-empty hidden>
          <span class="empty-icon" aria-hidden="true">◌</span>
          <h2>这个分类还在装修</h2>
          <p>换个分类看看，或者过阵子再来。</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ==================== 页脚 ==================== -->
  <footer class="site-footer">
    <div class="container footer-main">
      <div class="footer-brand">
        <a class="brand" href="#works" aria-label="皮神科技作品页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M12.5 9 6 16l6.5 7M19.5 9l6.5 7-6.5 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-text">皮神科技<span class="brand-dot">.</span></span>
        </a>
        <p data-copy="footerTagline">用代码做一些小而美的东西。</p>
      </div>

      <div class="footer-contact">
        <span class="footer-label">找我</span>
        <a href="mailto:hello@pishentech.cn" data-email-link data-email-text>hello@pishentech.cn</a>
        <a href="https://github.com/pishenX" target="_blank" rel="noopener noreferrer" data-github-link>github.com/pishenX</a>
      </div>
    </div>

    <div class="container footer-bottom">
      <p>© <span data-year>2026</span> <span data-copy="copyright">皮神科技</span>. All rights reserved.</p>
      <p class="footer-made">Made with <span aria-hidden="true">♥</span> &amp; too much coffee.</p>
    </div>
  </footer>

  <!-- 操作提示（比如点到了还没填的链接），平时隐藏 -->
  <div class="toast" role="status" aria-live="polite" data-toast></div>
</body>
</html>
